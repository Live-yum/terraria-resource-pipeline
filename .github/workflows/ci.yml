name: Go resource pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: |
          mkdir -p .runtime/container
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o .runtime/container/trp ./cmd/trp
          docker build -f Dockerfile.prebuilt -t trp-ci .
