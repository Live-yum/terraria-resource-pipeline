name: Resource pipeline synthetic acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js
      - run: python -m pip install playwright==1.56.1
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: test-results/
          retention-days: 7
  static-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tools/AssemblyInspector -c Release
      - run: dotnet build tests/fixtures/MetadataFixture -c Release
      - run: dotnet run --project tools/AssemblyInspector -c Release --no-build -- tests/fixtures/MetadataFixture/bin/Release/net10.0/MetadataFixture.dll /tmp/static-result.json
      - run: |
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/static-result.json'))
          assert result['executedInput'] is False
          assert result['complete'] is False
          assert result['ids']['ItemID']['Synthetic']==1
          assert result['ids']['ItemID']['ExactLarge']==18446744073709551615
          assert next(iter(result['languages'].values()))['ItemName']['Synthetic']=='原创合成物品'
          print('Static ID/localization extraction passed; untrusted initializer not executed')
          PY
